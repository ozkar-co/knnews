# --- temas (los 13 feeds actuales) ---
topics:
  - name: "Seguridad informatica"
    slug: seguridad
    description: >
      ciberseguridad, seguridad informatica, hacking, hackeos, vulnerabilidades,
      exploits, malware, ransomware, filtraciones de datos, brechas, leaks,
      grupos de hackers, doxxing, phishing, robo de credenciales, ciberataques,
      analisis de ataques informaticos, forense digital, ingenieria inversa,
      cifrado y criptografia. Incluye el chisme: quien hackeo a quien y que se
      filtro.
  - name: "Linux / software libre"
    slug: linux
    description: >
      GNU/Linux, distribuciones, kernel, software libre y open source,
      herramientas de linea de comandos, self-hosting, escritorio linux,
      hardware abierto y proyectos DIY
  - name: "Privacidad"
    slug: privacidad
    description: >
      privacidad digital, cifrado, vigilancia masiva, derechos digitales,
      anonimato, control de datos, grandes tecnologicas, censura, libertad de
      expresion, periodismo y libertad
  - name: "IA / ML"
    slug: ia
    description: >
      inteligencia artificial, machine learning, aprendizaje automatico,
      modelos de lenguaje grandes LLM, GPT, ChatGPT, Claude, Gemini, redes
      neuronales, investigacion en IA, etica y seguridad de la IA, agentes,
      regulacion de la IA, politicas y decisiones de gobiernos, lanzamientos
      de modelos de IA, industria de la IA, OpenAI, Anthropic, Google DeepMind,
      Meta AI
  - name: "Programacion"
    slug: programacion
    description: >
      programacion, desarrollo de software, arquitectura, ingenieria de
      software, lenguajes, rendimiento, bases de datos, algoritmos, ensayos
      tecnicos y oficio del programador
  - name: "Cultura digital"
    slug: cultura-digital
    description: >
      internet, cultura digital, redes sociales, tecnologia y sociedad,
      historia de la informatica, plataformas, economia de la atencion,
      cultura geek, cine y series, videojuegos como fenomeno cultural
  - name: "Ciencia"
    slug: ciencia
    description: >
      divulgacion cientifica, fisica, biologia, astronomia, investigacion,
      descubrimientos, medio ambiente, clima, matematicas y logica
  - name: "Colombia"
    slug: colombia
    description: >
      noticias de Colombia, actualidad colombiana, Pereira, Risaralda,
      Dosquebradas, Santa Rosa de Cabal, Eje Cafetero, Manizales, Armenia,
      Quindio, Caldas, gobierno de Colombia, congreso colombiano, Bogota,
      Medellin, Cali, Barranquilla, conflicto armado colombiano, ELN,
      disidencias de las FARC, fiscalia de Colombia, alcaldias de Colombia
  - name: "Internacional"
    slug: internacional
    description: >
      geopolitica, relaciones internacionales, conflictos, politica mundial,
      America Latina, Europa, Union Europea, protestas y manifestaciones,
      elecciones, medio oriente, hechos sistemicos del mundo
  - name: "Economia"
    slug: economia
    description: >
      economia, mercados, macroeconomia, crisis financiera, desigualdad,
      trabajo, vivienda, tecnologia y economia
  - name: "Ensayos / pensamiento"
    slug: ensayos
    description: >
      ensayos largos, pensamiento, filosofia, logica, blogs personales, opinion
      profunda sobre tecnologia, ideas, sociedad, libertad y critica de la
      tecnologia (neoludismo)
  - name: "Videojuegos"
    slug: videojuegos
    description: >
      videojuegos, industria del videojuego, analisis de juegos, consolas,
      PC gaming, retro gaming, historia de los videojuegos
  - name: "Autosostenibilidad / libertad"
    slug: autosostenibilidad
    description: >
      autosostenibilidad, vida offgrid, permacultura, libertad individual,
      autogobierno, soberania, tecnologia apropiada, energias renovables,
      comunidad y descentralizacion, critica del progreso y neoludismo
