# knnews · perfil de interes, importancia y ajustes.
# Los feeds publicados son los mismos que ya usas:
#   todo + 13 temas (seguridad, linux, privacidad, ia, programacion,
#   cultura-digital, ciencia, colombia, internacional, economia, ensayos,
#   videojuegos, autosostenibilidad). No se renombra ninguno.

port: 3010
cycle_hours: 2

# --- relevancia (tu gusto) ---
threshold: 0.58          # score minimo de relevancia para entrar
topic_floor: 0.10        # similitud minima para asignar tema (si no: otros)
knn_k: 15
weight_knn: 0.65
weight_anchor: 0.25
weight_dislike: 0.35

# --- importancia (contexto, independiente del gusto) ---
# importance = weight_salience*saliencia + weight_source_importance*prior_fuente
#              + weight_recency*recencia
importance_threshold: 0.50
weight_salience: 0.55
weight_source_importance: 0.25
weight_recency: 0.20
salience_similarity: 0.72   # coseno para considerar "el mismo hecho"
cluster_window_hours: 72    # ventana para agrupar eventos
max_cluster_sources: 5      # a partir de aqui la saliencia es maxima

# --- dominios (exclusion / penalizacion) ---
# Se calculan con centroides derivados del bootstrap (flags del LLM).
hard_exclude_domains: [celebrity, sports, crime]
domain_threshold: 0.52
soft_domains: [politics]

feeds_limit: 25
max_per_source: 4

# fuentes locales que deben tener presencia garantizada en el feed de Colombia
local_sources: [eldiario-local, lapatria, eje21]
local_per_source: 2

# --- texto completo ---
fulltext: true
fulltext_min_chars: 900
fulltext_timeout: 20

# --- descartados suaves (restan score; los duros van por dominio) ---
dislikes:
  - >
    farandula, celebridades, vida de famosos, reality shows, chismes de artistas
  - >
    deportes, futbol, resultados de partidos, fichajes, ligas, olimpiadas
  - >
    crimen comun, homicidios, hurtos, atracos, capturas, operativos policiales,
    mafia, narcotrafico, bandas criminales
  - >
    politica partidista, campanas electorales, disputas entre partidos,
    declaraciones de politicos
  - >
    ofertas, descuentos, rebajas, cupones, chollos, "en oferta", guias de compra,
    mejores productos para comprar, analisis de gadgets

# --- mapeo fuente -> tema (fuentes especializadas; el resto usa anclas) ---
source_topic:
  thehackernews: seguridad
  bleepingcomputer: seguridad
  unaaldia: seguridad
  seguinfo: seguridad
  securelist: seguridad
  nosolohacking: seguridad
  desdelinux: linux
  nosgustalinux: linux
  muylinux: linux
  linuxadictos: linux
  lwn: linux
  phoronix: linux
  quantamagazine: ciencia
  physorg: ciencia
  culturacientifica: ciencia
  eldiario/ciencia: ciencia
  lasillavacia: colombia
  semana/nacion: colombia
  elespectador/politica: colombia
  cuestionpublica: colombia
  latarde: colombia
  eldiario-local: colombia
  lapatria: colombia
  eje21: colombia
  eltiempo/colombia: colombia
  bbc/europa: internacional
  politico/europa: internacional
  france24/europa: internacional
  eldiario/internacional: internacional
  eldiario/economia: economia
  vidaextra: videojuegos
