# knnews · perfil de interes y ajustes de clasificacion.
# Edita este archivo a mano. Cada tema se convierte en un feed en
# http://<host>:3010/feeds/tema-<slug>.xml ademas del combinado /feeds/todo.xml.

# --- ajustes del servicio ---
port: 3010
cycle_hours: 2        # cada cuantas horas corre el ciclo en modo serve

# --- clasificacion ---
# score final = weight_knn * knn + weight_anchor * similitud_al_tema
#   knn     : fraccion ponderada de vecinos etiquetados como relevantes (0..1)
#   anchor  : similitud coseno al tema mas cercano (aprox -1..1)
threshold: 0.35       # score minimo para entrar en los feeds
topic_floor: 0.12     # similitud minima para asignar un tema (si no: 'otros')
knn_k: 15             # vecinos a considerar
weight_knn: 0.65
weight_anchor: 0.35
weight_dislike: 0.5   # cuanto resta la similitud con los 'dislikes'
feeds_limit: 80       # maximo de articulos por feed

# --- descartados: temas que NO te interesan (bajan el score) ---
# Todo lo que se parezca a estas descripciones resta weight_dislike * similitud,
# asi que no hace falta etiquetarlo a mano. Edita la lista a tu gusto.
dislikes:
  - >
    automoviles, coches, carros, motos, SUV, comparativas de vehiculos,
    novedades del motor, coches electricos
  - >
    deportes, futbol, resultados de partidos, fichajes, ligas, olimpiadas
  - >
    farandula, celebridades, vida de famosos, reality shows, chismes de artistas
  - >
    recetas de cocina, gastronomia, restaurantes, moda, belleza, horoscopos
  - >
    criptomonedas, trading, finanzas personales, consejos para ahorrar
  - >
    ofertas, descuentos, rebajas, cupones, chollos, "en oferta", recomendaciones
    y guias de compra, mejores productos para comprar, analisis de gadgets
  - >
    seguridad ciudadana, crimen comun, delincuencia, policia, capturas,
    homicidios, hurtos, atracos, accidentes de transito, mafia, narcotrafico,
    bandas criminales, conflicto armado, operativos militares, orden publico

# --- texto completo ---
# newsboat muestra el articulo sin salir de el si el feed trae <content:encoded>.
# Para las fuentes que solo publican un encabezado (ver 'python -m knnews check-feeds'),
# knnews descarga la pagina del articulo y extrae los parrafos del cuerpo.
fulltext: true
fulltext_min_chars: 900   # si el contenido del feed es menor, se intenta la pagina
fulltext_timeout: 20

# --- temas de interes ---
# name         : titulo legible (nombre del feed)
# slug         : nombre corto usado en la URL
# description  : texto que se vectoriza; describe el tema con tus palabras.
topics:
  - name: "Seguridad informatica"
    slug: seguridad
    description: >
      ciberseguridad, seguridad informatica, hacking, hackeos, vulnerabilidades,
      exploits, malware, ransomware, filtraciones de datos, brechas, leaks,
      grupos de hackers, doxxing, phishing, robo de credenciales, ciberataques,
      analisis de ataques informaticos, forense digital, ingenieria inversa,
      cifrado y criptografia. Incluye el chisme: quien hackeo a quien y que se
      filtro.
  - name: "Linux / software libre"
    slug: linux
    description: >
      GNU/Linux, distribuciones, kernel, software libre y open source,
      herramientas de linea de comandos, self-hosting, escritorio linux
  - name: "Privacidad"
    slug: privacidad
    description: >
      privacidad digital, cifrado, vigilancia masiva, derechos digitales,
      anonimato, control de datos, grandes tecnologicas, censura
  - name: "IA / ML"
    slug: ia
    description: >
      inteligencia artificial, aprendizaje automatico, modelos de lenguaje,
      redes neuronales, investigacion en IA, etica de la IA, agentes
  - name: "Programacion"
    slug: programacion
    description: >
      programacion, desarrollo de software, arquitectura, ingenieria de
      software, lenguajes, rendimiento, bases de datos, ensayos tecnicos
  - name: "Cultura digital"
    slug: cultura-digital
    description: >
      internet, cultura digital, redes sociales, tecnologia y sociedad,
      historia de la informatica, plataformas, economia de la atencion
  - name: "Ciencia"
    slug: ciencia
    description: >
      divulgacion cientifica, fisica, biologia, astronomia, investigacion,
      descubrimientos, medio ambiente, clima
  - name: "Colombia"
    slug: colombia
    description: >
      noticias de Colombia, actualidad colombiana, politica de Colombia,
      gobierno de Colombia, presidente de Colombia, congreso colombiano,
      Bogota, Medellin, Cali, Barranquilla, conflicto armado colombiano,
      ELN, disidencias de las FARC, fiscalia de Colombia, alcaldias de Colombia
  - name: "Internacional"
    slug: internacional
    description: >
      geopolitica, relaciones internacionales, conflictos, politica mundial,
      America Latina, medio oriente
  - name: "Economia"
    slug: economia
    description: >
      economia, mercados, macroeconomia, crisis financiera, desigualdad,
      trabajo, vivienda
  - name: "Ensayos / pensamiento"
    slug: ensayos
    description: >
      ensayos largos, pensamiento, filosofia, blogs personales, opinion
      profunda sobre tecnologia, ideas y sociedad
  - name: "Videojuegos"
    slug: videojuegos
    description: >
      videojuegos, industria del videojuego, analisis de juegos, consolas,
      PC gaming, retro gaming
  - name: "Autosostenibilidad / libertad"
    slug: autosostenibilidad
    description: >
      autosostenibilidad, vida offgrid, permacultura, libertad individual,
      autogobernanza, soberania, tecnologia apropiada, energias renovables,
      comunidad y descentralizacion
